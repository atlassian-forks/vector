[package]
name = "nom-language"
version = "0.1.0"
authors = ["contact@geoffroycouprie.com"]
description = "Language parsing focused combinators for the nom parser library"
edition = "2021"
license = "MIT"
repository = "https://github.com/rust-bakery/nom"

# This is a locally vendored copy of `nom-language` 0.1.0, patched to fix a bug.
# It is wired into the build via `[patch.crates-io]` in the workspace root Cargo.toml.

[lib]
name = "nom_language"
path = "src/lib.rs"

[dependencies]
nom = "8.0.0"
